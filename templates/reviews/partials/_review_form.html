{# The new-review form. Include with form=<ReviewForm>; posts and swaps the whole section. #}
{# The rating starts with no star checked; the submit button disables mid-request. #}
<form hx-post="{% url 'reviews:create' product.pk %}"
      hx-target="#reviews"
      hx-swap="outerHTML"
      hx-disabled-elt="find button[type='submit']"
      class="card mt-6 bg-base-100 shadow-md">
  <div class="card-body gap-4">
    <h3 class="card-title">Write a review</h3>

    {% include "reviews/partials/_review_fields.html" %}

    <div class="card-actions justify-end">
      <button type="submit" class="btn btn-primary">Post review</button>
    </div>
  </div>
</form>
